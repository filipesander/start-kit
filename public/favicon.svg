<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Fundo -->
  <rect width="100" height="100" rx="20" fill="url(#gradient)"/>

  <!-- Ícone de Foguete -->
  <g transform="translate(50, 50)">
    <!-- Corpo do foguete -->
    <path d="M -8,-25 L -8,15 L 0,25 L 8,15 L 8,-25 Z" fill="white" opacity="0.95"/>

    <!-- Janela -->
    <circle cx="0" cy="-10" r="5" fill="#667eea" opacity="0.8"/>

    <!-- Asa esquerda -->
    <path d="M -8,10 L -18,20 L -8,20 Z" fill="white" opacity="0.85"/>

    <!-- Asa direita -->
    <path d="M 8,10 L 18,20 L 8,20 Z" fill="white" opacity="0.85"/>

    <!-- Chama -->
    <ellipse cx="0" cy="28" rx="5" ry="6" fill="#FFD93D" opacity="0.9"/>
    <ellipse cx="0" cy="30" rx="3" ry="4" fill="#FF6B6B" opacity="0.8"/>
  </g>
</svg>
